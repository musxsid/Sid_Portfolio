spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:200420}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}

server:
  address: 0.0.0.0
  port: ${PORT:8080}

cors:
  frontend-url: ${CLIENT_URL:${FRONTEND_URL:}}

github:
  username: ${GITHUB_USERNAME:musxsid}
  token: ${GITHUB_TOKEN:}

groq:
  api:
    key: ${GROQ_API_KEY:}
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    fallback-model: ${GROQ_FALLBACK_MODEL:openai/gpt-oss-20b}
